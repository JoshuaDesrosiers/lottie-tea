[package]
name = "an1mbyt3-physics"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Unity-style 2D physics (Rigidbody 2D + colliders) for an1mbyt3 scenes,
# simulated by Rapier. Kept out of `an1mbyt3-core` (pure data) and
# `an1mbyt3-wasm` (editor glue) so it builds and tests natively on its own.
[dependencies]
an1mbyt3-core = { path = "../an1mbyt3-core" }
glam = { workspace = true }
rapier2d = { workspace = true }
