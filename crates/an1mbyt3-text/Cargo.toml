[package]
name = "an1mbyt3-text"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
an1mbyt3-core = { path = "../an1mbyt3-core" }
an1mbyt3-geometry = { path = "../an1mbyt3-geometry" }
an1mbyt3-renderer = { path = "../an1mbyt3-renderer" }
glam = { workspace = true }
rustybuzz = { workspace = true }

# winit/pollster/an1mbyt3-runtime are only needed by the `text_shape` demo
# example — see AN1MBYT3_BUILD_PLAN.md §3's note on `an1mbyt3-renderer`'s
# equivalent dev-dependency edge to `an1mbyt3-runtime` for why this is a
# dev-only edge, not a real dependency of this crate's library code.
[dev-dependencies]
winit = { workspace = true }
pollster = { workspace = true }
wgpu = { workspace = true }
an1mbyt3-runtime = { path = "../an1mbyt3-runtime" }
