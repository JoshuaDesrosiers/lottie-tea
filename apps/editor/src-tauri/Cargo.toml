[package]
name = "an1mbyt3-editor"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Tauri 2 desktop shell for the An1mbyt3 editor — see AN1MBYT3_BUILD_PLAN.md §10 Phase 4."
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "an1mbyt3_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
# The native shell's one real job now (see lib.rs's module doc): file-open/
# save dialogs. Read/write itself is plain `std::fs` in commands.rs — no
# separate fs plugin needed, since these commands never expose raw fs access
# to JS, only whole-file read/write behind our own path-taking commands.
tauri-plugin-dialog = "2"

# Deliberately no an1mbyt3-core/an1mbyt3-renderer/wgpu/glam here anymore —
# this crate's `lib.rs` module doc explains why: the document model and
# rendering both moved into `crates/an1mbyt3-wasm`'s `WasmEditor`, running
# in the frontend's webview instead of this native process.
